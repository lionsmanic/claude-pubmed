<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GynOnc Literature Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream:#fdf8f2; --warm-white:#fff9f4; --parchment:#f5ede0; --sand:#e8d5bb;
  --gold:#c9922a; --gold-light:#e8b84b; --gold-pale:#faf0dc;
  --sienna:#a0522d; --rust:#c0603a;
  --teal:#2a7c74; --teal-light:#3a9e94; --teal-pale:#e8f4f2;
  --ink:#2c1f14; --ink-mid:#4a3728; --ink-light:#7a6155; --ink-muted:#a89080;
  --border:rgba(180,130,80,0.18); --border-warm:rgba(180,130,80,0.38);
  --shadow-sm:0 2px 12px rgba(80,40,10,0.07); --shadow-md:0 6px 30px rgba(80,40,10,0.11);
  --danger:#c0392b; --danger-pale:#fff0ee;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream);color:var(--ink);
  min-height:100vh;display:grid;grid-template-columns:340px 1fr;grid-template-rows:auto 1fr;}

/* HEADER */
header{grid-column:1/-1;background:var(--ink);padding:0 2.5rem;height:66px;
  display:flex;align-items:center;gap:1.5rem;position:sticky;top:0;z-index:100;
  box-shadow:0 2px 24px rgba(0,0,0,0.22);}
.logo{display:flex;align-items:center;gap:13px;}
.logo-mark{width:38px;height:38px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);}
.logo-text h1{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:600;
  color:#fdf8f2;letter-spacing:.02em;}
.logo-text p{font-size:.67rem;color:#8a7060;letter-spacing:.1em;text-transform:uppercase;margin-top:1px;}
.header-right{margin-left:auto;}
.status-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:5px 14px;}
.pulse{width:7px;height:7px;border-radius:50%;background:#52c78a;transition:background .3s;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#status-text{font-size:.72rem;color:rgba(255,255,255,.55);font-family:'JetBrains Mono',monospace;}

/* SIDEBAR */
aside{background:var(--warm-white);border-right:1px solid var(--border);padding:1.4rem;
  overflow-y:auto;height:calc(100vh - 66px);position:sticky;top:66px;
  display:flex;flex-direction:column;gap:1rem;}
aside::-webkit-scrollbar{width:4px;}
aside::-webkit-scrollbar-thumb{background:var(--sand);border-radius:2px;}

.panel{background:white;border:1.5px solid var(--border);border-radius:14px;
  padding:1.1rem 1.2rem;box-shadow:var(--shadow-sm);}
.panel-label{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);font-weight:700;margin-bottom:.9rem;
  display:flex;align-items:center;gap:7px;}
.panel-label::after{content:'';flex:1;height:1px;background:var(--border);}

label{display:block;font-size:.8rem;color:var(--ink-light);margin-bottom:4px;font-weight:500;}
input[type=text],input[type=password],input[type=email],input[type=number]{
  width:100%;background:var(--cream);border:1.5px solid var(--border);
  border-radius:8px;color:var(--ink);padding:.48rem .8rem;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:.82rem;
  outline:none;transition:border-color .2s,box-shadow .2s;margin-bottom:.65rem;}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,146,42,.12);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}

.check-grid{display:flex;flex-direction:column;gap:.28rem;margin-bottom:.75rem;}
.check-item{display:flex;align-items:center;gap:8px;padding:.32rem .65rem;border-radius:8px;
  cursor:pointer;font-size:.82rem;color:var(--ink-mid);
  border:1.5px solid transparent;transition:all .15s;user-select:none;}
.check-item:has(input:checked){background:var(--gold-pale);border-color:rgba(201,146,42,.28);color:var(--ink);}
.check-item input[type=checkbox]{accent-color:var(--gold);width:auto;margin:0;padding:0;border:none;background:none;box-shadow:none;}
.inline-check{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--ink-mid);
  margin-bottom:.7rem;cursor:pointer;}
.inline-check input{accent-color:var(--gold);width:auto;margin:0;padding:0;border:none;background:none;box-shadow:none;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:.58rem 1rem;border-radius:9px;border:none;cursor:pointer;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:.83rem;font-weight:600;
  transition:all .18s;width:100%;white-space:nowrap;letter-spacing:.01em;}
.btn-gold{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:white;
  box-shadow:0 3px 14px rgba(201,146,42,.32);}
.btn-gold:hover{filter:brightness(1.07);transform:translateY(-1px);}
.btn-gold:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-teal{background:var(--teal);color:white;box-shadow:0 3px 12px rgba(42,124,116,.28);}
.btn-teal:hover{background:var(--teal-light);transform:translateY(-1px);}
.btn-teal:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-outline{background:white;color:var(--ink-mid);border:1.5px solid var(--border-warm);}
.btn-outline:hover{background:var(--parchment);border-color:var(--gold);color:var(--ink);}
.btn-outline:disabled{opacity:.4;cursor:not-allowed;}
.btn-stop{background:var(--danger-pale);color:var(--danger);border:1.5px solid rgba(192,57,43,.22);}
.btn-stop:hover{background:#ffe4e0;}
.btn-selected{background:var(--teal-pale);color:var(--teal);border:1.5px solid rgba(42,124,116,.3);}
.btn-selected:hover{background:var(--teal);color:white;}
.btn-sm{width:auto;padding:.33rem .85rem;font-size:.76rem;border-radius:7px;}
.btn-row{display:flex;gap:.5rem;}

/* MAIN */
main{background:var(--cream);padding:2rem 2.5rem;overflow-y:auto;height:calc(100vh - 66px);}
main::-webkit-scrollbar{width:5px;}
main::-webkit-scrollbar-thumb{background:var(--sand);border-radius:3px;}

.toolbar{display:flex;align-items:center;gap:.7rem;margin-bottom:1.8rem;flex-wrap:wrap;}
.toolbar-title{font-family:'Playfair Display',serif;font-size:1.35rem;color:var(--ink);}
.count-pill{background:var(--gold-pale);color:var(--gold);
  border:1px solid rgba(201,146,42,.28);font-size:.73rem;font-weight:600;
  padding:3px 11px;border-radius:20px;font-family:'JetBrains Mono',monospace;}
.toolbar-gap{flex:1;}

#progress-wrap{height:3px;background:var(--sand);border-radius:2px;margin-bottom:1.5rem;overflow:hidden;display:none;}
#progress-wrap.on{display:block;}
#progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--gold-light),var(--teal-light));
  border-radius:2px;transition:width .5s ease;}

/* SELECT BAR */
#select-bar{
  background:white;border:1.5px solid var(--border);border-radius:12px;
  padding:.75rem 1.2rem;margin-bottom:1.2rem;
  display:none;align-items:center;gap:.8rem;flex-wrap:wrap;
}
#select-bar.show{display:flex;}
.sel-count{font-size:.82rem;color:var(--ink-mid);font-weight:500;}
.sel-count strong{color:var(--teal);}

/* ARTICLE CARDS */
.article-card{background:white;border:1.5px solid var(--border);border-radius:16px;
  margin-bottom:1.2rem;box-shadow:var(--shadow-sm);overflow:hidden;
  transition:border-color .2s,box-shadow .2s;}
.article-card:hover{border-color:var(--border-warm);box-shadow:var(--shadow-md);}
.article-card.selected{border-color:rgba(42,124,116,.45);background:linear-gradient(180deg,rgba(232,244,242,.4),white);}

.card-top{padding:1.4rem 1.6rem .2rem;display:flex;gap:1rem;align-items:flex-start;}
.card-check{padding-top:4px;flex-shrink:0;}
.card-check input[type=checkbox]{width:17px;height:17px;accent-color:var(--teal);cursor:pointer;}
.card-num{font-family:'Playfair Display',serif;font-style:italic;font-size:1.7rem;
  color:var(--sand);line-height:1;min-width:34px;padding-top:3px;flex-shrink:0;}
.card-body{flex:1;min-width:0;}
.card-en{font-size:1rem;font-weight:600;line-height:1.45;color:var(--ink);margin-bottom:.35rem;}
.card-en a{color:inherit;text-decoration:none;}
.card-en a:hover{color:var(--teal);}
.card-zh{font-size:.9rem;color:var(--teal);font-weight:500;line-height:1.4;margin-bottom:.5rem;}
.card-meta{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
.meta-j{font-size:.74rem;color:var(--ink-light);font-family:'JetBrains Mono',monospace;}
.meta-tag{font-size:.67rem;padding:2px 8px;border-radius:5px;
  background:var(--parchment);color:var(--sienna);border:1px solid var(--sand);font-weight:500;}

.card-actions{padding:.9rem 1.6rem 1.2rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}

/* ANALYSIS */
.analysis-wrap{border-top:1.5px solid var(--border);
  background:linear-gradient(180deg,var(--teal-pale) 0%,white 100%);display:none;}
.analysis-wrap.open{display:block;}
.analysis-inner{padding:1.6rem 1.9rem;}

/* spinner */
.spinner-box{display:flex;align-items:center;gap:14px;padding:1.2rem;
  background:var(--gold-pale);border-radius:10px;border:1px solid var(--sand);}
.spinner{width:22px;height:22px;border:3px solid var(--sand);
  border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner-txt{font-size:.85rem;color:var(--ink-mid);}
.spinner-sub{font-size:.75rem;color:var(--ink-muted);margin-top:2px;}

/* analysis content */
.analysis-body{font-size:.9rem;line-height:1.85;color:var(--ink-mid);}
.sec{margin-bottom:1.4rem;}
.sec-title{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--teal);margin-bottom:.6rem;display:flex;align-items:center;gap:8px;}
.sec-title::after{content:'';flex:1;height:1px;background:rgba(42,124,116,.2);}
.analysis-body ul{padding-left:1.2rem;}
.analysis-body li{margin-bottom:.45rem;}
.analysis-body p{margin-bottom:.5rem;}
.analysis-body strong{color:var(--ink);font-weight:600;}

/* EMPTY */
.empty{text-align:center;padding:6rem 2rem;}
.empty-glyph{font-family:'Playfair Display',serif;font-style:italic;font-size:3.5rem;color:var(--sand);margin-bottom:1rem;}
.empty h2{font-family:'Playfair Display',serif;font-size:1.35rem;color:var(--ink-muted);margin-bottom:.5rem;}
.empty p{font-size:.88rem;color:var(--ink-muted);line-height:1.8;}

/* TOAST */
#toast{position:fixed;bottom:5rem;right:1rem;z-index:999;
  background:var(--ink);color:var(--cream);border-radius:10px;padding:.75rem 1.3rem;
  font-size:.83rem;box-shadow:0 8px 30px rgba(0,0,0,.2);
  transform:translateY(14px) scale(.96);opacity:0;transition:all .25s;
  pointer-events:none;max-width:340px;}
#toast.show{transform:translateY(0) scale(1);opacity:1;}
#toast.ok{background:var(--teal);}
#toast.err{background:var(--danger);}

.n-badge{display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;border-radius:50%;
  background:var(--rust);color:white;font-size:.62rem;font-weight:700;margin-left:3px;}

/* analysis progress inline */
.analysis-progress{
  font-size:.75rem;color:var(--ink-muted);font-family:'JetBrains Mono',monospace;
  padding:.4rem .8rem;background:var(--gold-pale);border-radius:6px;
  border:1px solid var(--sand);display:inline-block;margin-bottom:.8rem;}

/* CART DRAWER */
#cart-overlay{position:fixed;inset:0;background:rgba(44,31,20,.45);z-index:200;
  display:none;backdrop-filter:blur(2px);}
#cart-overlay.open{display:block;}
#cart-drawer{position:fixed;right:0;top:0;bottom:0;width:480px;max-width:95vw;
  background:var(--warm-white);box-shadow:-8px 0 40px rgba(44,31,20,.18);
  z-index:201;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
#cart-drawer.open{transform:translateX(0);}
.drawer-header{padding:1.3rem 1.5rem;border-bottom:1.5px solid var(--border);
  display:flex;align-items:center;gap:.8rem;background:white;flex-shrink:0;}
.drawer-title{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:600;color:var(--ink);flex:1;}
.drawer-body{flex:1;overflow-y:auto;padding:1rem 1.5rem;}
.drawer-body::-webkit-scrollbar{width:4px;}
.drawer-body::-webkit-scrollbar-thumb{background:var(--sand);border-radius:2px;}
.drawer-footer{padding:1rem 1.5rem;border-top:1.5px solid var(--border);
  background:white;flex-shrink:0;display:flex;flex-direction:column;gap:.7rem;}

.cart-item{background:white;border:1.5px solid var(--border);border-radius:12px;
  padding:.9rem 1rem;margin-bottom:.8rem;display:flex;gap:.8rem;align-items:flex-start;
  transition:border-color .2s;}
.cart-item:hover{border-color:var(--border-warm);}
.cart-item-num{font-family:'Playfair Display',serif;font-style:italic;
  font-size:1.2rem;color:var(--sand);min-width:24px;flex-shrink:0;}
.cart-item-body{flex:1;min-width:0;}
.cart-item-en{font-size:.82rem;font-weight:600;color:var(--ink);line-height:1.4;margin-bottom:.2rem;}
.cart-item-en a{color:inherit;text-decoration:none;}
.cart-item-en a:hover{color:var(--teal);}
.cart-item-zh{font-size:.78rem;color:var(--teal);margin-bottom:.25rem;line-height:1.3;}
.cart-item-meta{font-size:.7rem;color:var(--ink-muted);font-family:'JetBrains Mono',monospace;}
.cart-item-tag{font-size:.65rem;background:var(--gold-pale);color:var(--sienna);
  border:1px solid var(--sand);border-radius:4px;padding:1px 6px;margin-left:4px;}
.cart-remove{flex-shrink:0;width:32px;height:32px;border-radius:50%;border:none;
  background:transparent;color:var(--ink-muted);cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;transition:all .15s;}
.cart-remove:hover{background:var(--danger-pale);color:var(--danger);}
.cart-empty{text-align:center;padding:3rem 1rem;color:var(--ink-muted);}
.cart-empty-icon{font-family:'Playfair Display',serif;font-style:italic;font-size:2.5rem;color:var(--sand);margin-bottom:.8rem;}

/* SIDEBAR OVERLAY (mobile) */
#sidebar-overlay{position:fixed;inset:0;background:rgba(44,31,20,.5);z-index:150;
  display:none;backdrop-filter:blur(1px);}
#sidebar-overlay.open{display:block;}

/* header cart button */
.cart-btn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:5px 13px;
  cursor:pointer;color:rgba(255,255,255,.75);font-size:.78rem;font-weight:500;
  transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif;}
.cart-btn:hover{background:rgba(255,255,255,.15);color:white;}
.cart-btn-badge{background:var(--rust);color:white;border-radius:50%;
  width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;
  font-size:.62rem;font-weight:700;}

/* HAMBURGER */
.hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;
  width:40px;height:40px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  border-radius:8px;cursor:pointer;padding:8px;flex-shrink:0;}
.hamburger span{display:block;height:2px;background:rgba(255,255,255,.8);border-radius:1px;
  transition:all .25s;}

/* BOTTOM NAV (mobile only) */
#bottom-nav{display:none;}

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  body{
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
  }

  /* Header: compact */
  header{
    padding:0 1rem;height:56px;gap:0.8rem;
    grid-column:1;
  }
  .logo-text p{display:none;}
  .logo-text h1{font-size:.95rem;}
  .logo-mark{width:30px;height:30px;}
  .hamburger{display:flex;}
  .status-pill{display:none;}
  .cart-btn span:not(.cart-btn-badge){display:none;}
  .cart-btn{padding:7px 10px;border-radius:50%;width:38px;height:38px;
    justify-content:center;}

  /* Sidebar: slide-in drawer from left */
  aside{
    position:fixed;left:0;top:0;bottom:0;width:320px;max-width:88vw;
    height:100vh;z-index:151;
    transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
    border-right:1.5px solid var(--border);
    box-shadow:4px 0 30px rgba(44,31,20,.15);
    padding-top:70px;
  }
  aside.open{transform:translateX(0);}

  /* Main: full width, bottom padding for nav */
  main{
    padding:1.2rem 1rem 5rem;
    height:auto;
    overflow-y:visible;
    grid-column:1;
  }

  /* Toolbar: compact, scrollable row */
  .toolbar{
    gap:.5rem;
    margin-bottom:1.2rem;
    overflow-x:auto;
    flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch;
    padding-bottom:.3rem;
  }
  .toolbar::-webkit-scrollbar{display:none;}
  .toolbar-title{font-size:1.1rem;white-space:nowrap;}
  .toolbar-gap{min-width:.5rem;flex:none;}

  /* Select bar: wrap */
  #select-bar{flex-wrap:wrap;gap:.5rem;padding:.6rem .8rem;}

  /* Article cards: tighter */
  .card-top{padding:1rem 1rem .2rem;}
  .card-num{font-size:1.3rem;min-width:26px;}
  .card-en{font-size:.92rem;}
  .card-zh{font-size:.84rem;}
  .card-actions{padding:.7rem 1rem 1rem;gap:.4rem;}
  .analysis-inner{padding:1.2rem 1rem;}
  .analysis-body{font-size:.85rem;}

  /* Bottom nav */
  #bottom-nav{
    display:flex;
    position:fixed;bottom:0;left:0;right:0;
    height:60px;
    background:white;
    border-top:1.5px solid var(--border);
    box-shadow:0 -4px 20px rgba(80,40,10,.08);
    z-index:100;
    align-items:stretch;
  }
  .nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;cursor:pointer;border:none;background:none;
    color:var(--ink-muted);font-size:.62rem;font-weight:500;
    font-family:'Plus Jakarta Sans',sans-serif;
    transition:color .15s;padding:0;position:relative;
  }
  .nav-item.active{color:var(--teal);}
  .nav-item:active{background:var(--parchment);}
  .nav-icon{font-size:1.25rem;line-height:1;}
  .nav-badge{position:absolute;top:6px;right:calc(50% - 16px);
    background:var(--rust);color:white;border-radius:10px;
    font-size:.55rem;font-weight:700;padding:1px 5px;min-width:16px;text-align:center;
    display:none;}
  .nav-badge.show{display:block;}

  /* Cart drawer full-height on mobile */
  #cart-drawer{width:100%;max-width:100%;right:0;
    top:auto;bottom:0;height:92vh;
    transform:translateY(100%);border-radius:20px 20px 0 0;}
  #cart-drawer.open{transform:translateY(0);}
  #cart-overlay{z-index:200;}

  /* Toast above bottom nav */
  #toast{bottom:4.5rem;}
}

@media (max-width: 480px) {
  .card-actions .btn-sm{font-size:.72rem;padding:.3rem .6rem;}
  .btn{font-size:.82rem;}
  .check-item{font-size:.8rem;}
  label{font-size:.8rem;}
  input[type=text],input[type=password],input[type=email],input[type=number]{
    font-size:.85rem;padding:.55rem .8rem;}
}

</style>
</head>
<body>

<header>
  <button class="hamburger" onclick="toggleSidebar()" aria-label="設定選單">
    <span></span><span></span><span></span>
  </button>
  <div class="logo">
    <div class="logo-mark"></div>
    <div class="logo-text">
      <h1>GynOnc Literature Monitor</h1>
      <p>PubMed × Gemini AI · 婦科腫瘤文獻智慧評讀</p>
    </div>
  </div>
  <div class="header-right" style="display:flex;align-items:center;gap:.8rem;">
    <button class="cart-btn" onclick="openCart()">
      🛒 <span>購物車</span>
      <span class="cart-btn-badge" id="cart-badge" style="display:none">0</span>
    </button>
    <div class="status-pill">
      <div class="pulse" id="status-dot"></div>
      <span id="status-text">Ready</span>
    </div>
  </div>
</header>

<!-- SIDEBAR OVERLAY (mobile) -->
<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- CART DRAWER -->
<div id="cart-overlay" onclick="closeCart()"></div>
<div id="cart-drawer">
  <div style="display:flex;justify-content:center;padding:.6rem 0 0;flex-shrink:0;">
    <div style="width:40px;height:4px;background:var(--sand);border-radius:2px;"></div>
  </div>
  <div class="drawer-header">
    <span class="drawer-title">📋 報告購物車</span>
    <span id="drawer-count" style="font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--ink-muted)">0 篇</span>

<div id="toast"></div>

<script>
const JOURNALS = ["New England Journal of Medicine","The Lancet","The Lancet Oncology","Journal of Clinical Oncology","Nature Medicine","Gynecologic Oncology","Journal of Gynecologic Oncology","Annals of Oncology","Cancer","JAMA Oncology"];

let articles = [], analysisCache = {};
let cart = cartLoad();   // persistent across searches
let abortFlag = false, isRunningBatch = false;
let selectMode = false, selectedItems = new Set();

const v = id => document.getElementById(id).value.trim();
const el = id => document.getElementById(id);

/* ── CONFIG ── */
function saveConfig() {
  const cfg = {
    geminiKey:v('gemini-key'), geminiModel:v('gemini-model'),
    entrezEmail:v('entrez-email'), ghOwner:v('gh-owner'), ghRepo:v('gh-repo'),
    ghBranch:v('gh-branch'), ghWorkflow:v('gh-workflow'), ghToken:v('gh-token'),
    customKeywords:v('custom-keywords'), daysBack:v('days-back'), maxResults:v('max-results'),
    limitJournals:el('limit-journals').checked,
    topics:[...document.querySelectorAll('#topic-toggles input')].map(i=>i.checked)
  };
  localStorage.setItem('gynonc_v3', JSON.stringify(cfg));
  toast('設定已儲存','ok');
}
function loadConfig() {
  try {
    const raw = localStorage.getItem('gynonc_v3') || localStorage.getItem('gynonc_v2') || localStorage.getItem('gynonc_cfg') || '{}';
    const cfg = JSON.parse(raw);
    const s = (id,val) => { if (val !== undefined && val !== null && val !== '') el(id).value = val; };
    s('gemini-key',cfg.geminiKey); s('gemini-model',cfg.geminiModel);
    s('entrez-email',cfg.entrezEmail); s('gh-owner',cfg.ghOwner);
    s('gh-repo',cfg.ghRepo); s('gh-branch',cfg.ghBranch);
    s('gh-workflow',cfg.ghWorkflow); s('gh-token',cfg.ghToken);
    s('custom-keywords',cfg.customKeywords); s('days-back',cfg.daysBack); s('max-results',cfg.maxResults);
    if (cfg.limitJournals !== undefined) el('limit-journals').checked = cfg.limitJournals;
    if (cfg.topics) [...document.querySelectorAll('#topic-toggles input')].forEach((b,i) => { if (cfg.topics[i]!==undefined) b.checked=cfg.topics[i]; });
  } catch(e){}
}

/* ── QUERY ── */
function buildQuery() {
  const kw = [];
  document.querySelectorAll('#topic-toggles input:checked').forEach(c => c.value.split(',').forEach(k=>kw.push(k.trim())));
  v('custom-keywords').split(',').forEach(k=>{if(k.trim())kw.push(k.trim());});
  if (!kw.length) return null;
  let q = '('+kw.map(k=>`"${k}"[Title/Abstract]`).join(' OR ')+')';
  if (el('limit-journals').checked)
    q += ' AND ('+JOURNALS.map(j=>`"${j}"[Journal]`).join(' OR ')+')';
  return q;
}

/* ── PUBMED ── */
async function fetchPubMed(query, days, max, email) {
  const base = 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/';
  const sr = await fetch(`${base}esearch.fcgi?db=pubmed&term=${encodeURIComponent(query)}&reldate=${days}&retmax=${max}&sort=date&retmode=json&email=${encodeURIComponent(email)}`);
  const sd = await sr.json();
  const ids = sd.esearchresult?.idlist || [];
  if (!ids.length) return [];
  const fr = await fetch(`${base}efetch.fcgi?db=pubmed&id=${ids.join(',')}&retmode=xml&email=${encodeURIComponent(email)}`);
  const xml = new DOMParser().parseFromString(await fr.text(),'text/xml');
  return [...xml.querySelectorAll('PubmedArticle')].map((art,idx)=>{
    try {
      const title = art.querySelector('ArticleTitle')?.textContent||'';
      const journal = art.querySelector('Journal > Title')?.textContent||'';
      const abstract = [...art.querySelectorAll('AbstractText')].map(a=>a.textContent).join(' ')||'No abstract available.';
      const doi = art.querySelector('ArticleId[IdType="doi"]')?.textContent||'';
      const pmid = art.querySelector('ArticleId[IdType="pubmed"]')?.textContent||ids[idx];
      const link = doi?`https://doi.org/${doi}`:`https://pubmed.ncbi.nlm.nih.gov/${pmid}/`;
      const yr = art.querySelector('PubDate > Year')?.textContent||'';
      const mo = art.querySelector('PubDate > Month')?.textContent||'';
      return {pmid,title,journal,abstract,link,doi,date:`${mo} ${yr}`.trim(),titleZh:''};
    } catch{return null;}
  }).filter(Boolean);
}

/* ── TRANSLATE ── */
async function translateTitle(title) {
  try {
    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(title)}`);
    return (await r.json())[0].map(x=>x[0]).join('');
  } catch{return '';}
}

/* ── GEMINI (non-streaming, reliable) ── */
async function callGemini(art) {
  const apiKey = v('gemini-key');
  const model = v('gemini-model') || 'gemini-2.5-flash';
  if (!apiKey) throw new Error('請先輸入 Gemini API Key');

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
  const prompt = `你是一位在台灣執業多年的婦科腫瘤科醫師，擅長閱讀英文醫學文獻並消化轉譯給同儕。

請完整閱讀以下這篇論文的摘要，然後用繁體中文（台灣用語）寫出一份「臨床評讀摘要」。
目標讀者是忙碌的婦癌醫師，希望在 2 分鐘內掌握這篇文章的精華與臨床意義。

【論文資訊】
標題：${art.title}
期刊：${art.journal}
摘要原文：${art.abstract}

【請依以下四個區塊輸出，每個區塊以 ### 開頭】

### 🔬 這篇在研究什麼？
用 2–3 句話說明研究背景、設計類型、樣本規模和主要研究問題。
不要只列清單，請寫成流暢的說明文字。

### 📊 關鍵數據與結果
列出 3–5 條最重要的數據發現（含具體數字、p值、HR、OS、PFS 等）。
每條以 • 開頭，數據要完整呈現，不要省略百分比或統計值。

### 🏥 對臨床實務的影響
2–3 句話說明這個結果對台灣婦癌醫師的實際意義：
哪些病人可能受益？是否改變現行治療決策？與 NCCN/ESMO 指引的關係？

### ⭐ 一句話總結
用一句話（最多 50 字）總結「這篇文章最值得婦癌醫師記住的事」。`;

  const resp = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents:[{parts:[{text:prompt}]}],
      generationConfig:{
        temperature:0.3,
        maxOutputTokens:2048,
        thinkingConfig:{ thinkingBudget:0 }   // 關閉思考模式，避免耗盡 token
      }
    })
  });

  if (!resp.ok) {
    const errData = await resp.json().catch(()=>({}));
    throw new Error(`API ${resp.status}: ${errData.error?.message || resp.statusText}`);
  }

  const data = await resp.json();
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!text) throw new Error('API 回傳空內容，請確認 API Key 和模型名稱');

  const finishReason = data.candidates?.[0]?.finishReason;
  if (finishReason === 'MAX_TOKENS') {
    return text + '\n\n> ⚠️ 內容被截斷，請在左側將模型改為 gemini-2.5-flash 後重新分析。';
  }
  return text;
}

/* ── RENDER MARKDOWN ── */
function renderMd(text) {
  const sections = text.split(/(?=###\s)/);
  let html = '';
  for (const sec of sections) {
    if (!sec.trim()) continue;
    const lines = sec.trim().split('\n');
    const titleLine = lines[0].replace(/^###\s*/,'').trim();
    const body = lines.slice(1).join('\n').trim();
    let bodyHtml = '', inList = false;
    for (const bl of body.split('\n')) {
      const t = bl.trim();
      if (!t) { if(inList){bodyHtml+='</ul>';inList=false;} continue; }
      if (/^[•\-\*]/.test(t)) {
        if (!inList){bodyHtml+='<ul>';inList=true;}
        bodyHtml += `<li>${t.replace(/^[•\-\*]\s*/,'').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}</li>`;
      } else {
        if(inList){bodyHtml+='</ul>';inList=false;}
        bodyHtml += `<p>${t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}</p>`;
      }
    }
    if (inList) bodyHtml += '</ul>';
    html += titleLine
      ? `<div class="sec"><div class="sec-title">${titleLine}</div>${bodyHtml}</div>`
      : `<div class="sec">${bodyHtml}</div>`;
  }
  return `<div class="analysis-body">${html}</div>`;
}

/* ── SEARCH ── */
async function runSearch() {
  const email = v('entrez-email') || 'gynonc@monitor.com';
  const query = buildQuery();
  if (!query) { toast('請至少選一個主題','err'); return; }
  setStatus('Searching PubMed…',true); setProgress(15);
  el('search-btn').disabled = true;
  el('results-container').innerHTML = '';
  articles = []; analysisCache = {}; selectedItems.clear();
  hideSelectUI();

  try {
    const raw = await fetchPubMed(query, v('days-back')||14, v('max-results')||20, email);
    setProgress(50);
    if (!raw.length) {
      el('results-container').innerHTML = '<div class="empty"><div class="empty-glyph">∅</div><h2>無結果</h2><p>本期間無符合條件的文章，請調整關鍵字或延長天數。</p></div>';
      setStatus('No results'); setProgress(100,true);
      el('search-btn').disabled = false;
      return;
    }
    setStatus(`翻譯 ${raw.length} 篇標題…`,true);
    articles = await Promise.all(raw.map(async a=>{a.titleZh=await translateTitle(a.title);return a;}));
    setProgress(90); renderArticles(); setProgress(100,true);
    setStatus(`找到 ${articles.length} 篇`,false);
    el('results-count').textContent=`${articles.length} 篇`; el('results-count').style.display='';
    el('analyze-all-btn').style.display='';
    el('select-mode-btn').style.display='';
    el('add-all-btn').style.display='';
    toast(`找到 ${articles.length} 篇文章`,'ok');
  } catch(e) { toast(`搜尋失敗：${e.message}`,'err'); setStatus('Error'); setProgress(100,true); el('search-btn').disabled = false; }
  el('search-btn').disabled = false;
}

/* ── RENDER ARTICLES ── */
function renderArticles() {
  el('results-container').innerHTML = articles.map((art,i)=>`
    <div class="article-card" id="card-${i}">
      <div class="card-top">
        <div class="card-check" id="check-wrap-${i}" style="display:none">
          <input type="checkbox" id="chk-${i}" onchange="onCheckChange(${i})">
        </div>
        <div class="card-num">${String(i+1).padStart(2,'0')}</div>
        <div class="card-body">
          <div class="card-en"><a href="${art.link}" target="_blank">${art.title}</a></div>
          ${art.titleZh?`<div class="card-zh">${art.titleZh}</div>`:''}
          <div class="card-meta">
            <span class="meta-j">${art.journal}</span>
            ${art.date?`<span class="meta-tag">${art.date}</span>`:''}
            ${art.doi?`<span class="meta-tag">DOI</span>`:''}
          </div>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn btn-outline btn-sm" id="abtn-${i}" onclick="toggleAnalysis(${i})">AI 評讀</button>
        <button class="btn btn-outline btn-sm" onclick="addToCart(${i})">+ 加入報告</button>
        <a href="${art.link}" target="_blank" class="btn btn-outline btn-sm" style="text-decoration:none">原文 ↗</a>
      </div>
      <div class="analysis-wrap" id="awrap-${i}">
        <div class="analysis-inner" id="ainner-${i}"></div>
      </div>
    </div>`).join('');
}

/* ── INDIVIDUAL ANALYSIS ── */
async function toggleAnalysis(idx) {
  const wrap = el(`awrap-${idx}`);
  const inner = el(`ainner-${idx}`);
  const btn = el(`abtn-${idx}`);

  if (wrap.classList.contains('open')) {
    wrap.classList.remove('open'); btn.textContent='AI 評讀'; return;
  }
  wrap.classList.add('open');

  if (analysisCache[idx]) {
    inner.innerHTML = renderMd(analysisCache[idx]); btn.textContent='收起'; return;
  }

  if (!v('gemini-key')) {
    inner.innerHTML='<p style="padding:1rem;color:var(--danger)">請先在左側輸入 Gemini API Key</p>';
    btn.textContent='收起'; return;
  }

  btn.textContent='分析中…'; btn.disabled=true;
  inner.innerHTML=`<div class="spinner-box">
    <div class="spinner"></div>
    <div><div class="spinner-txt">Gemini AI 評讀中，請稍候…</div>
    <div class="spinner-sub">通常需要 10–20 秒</div></div>
  </div>`;

  try {
    setStatus(`分析第 ${idx+1} 篇…`,true);
    const text = await callGemini(articles[idx]);
    analysisCache[idx] = text;
    inner.innerHTML = renderMd(text);
    // 分析完成後更新購物車中同一篇的 analysis 欄位（若已在購物車）
    const existing = cart.find(c => c.pmid === articles[idx].pmid);
    if (existing) { existing.analysis = text; cartSave(); }
    setStatus('Ready',false);
  } catch(e) {
    inner.innerHTML=`<p style="padding:1rem;color:var(--danger)">分析失敗：${e.message}</p>`;
    toast(e.message,'err');
    setStatus('Error',false);
  }
  btn.textContent='收起'; btn.disabled=false;
}

/* ── BATCH: ANALYZE ALL ── */
async function analyzeAll() {
  if (!v('gemini-key')) { toast('請先輸入 Gemini API Key','err'); return; }
  if (!articles.length) { toast('請先搜尋文獻','err'); return; }
  startBatch();
  for (let i=0; i<articles.length; i++) {
    if (abortFlag) break;
    if (!analysisCache[i]) await runBatchItem(i, articles.length);
  }
  endBatch();
}

/* ── BATCH: ANALYZE SELECTED ── */
async function analyzeSelected() {
  if (!v('gemini-key')) { toast('請先輸入 Gemini API Key','err'); return; }
  if (!selectedItems.size) { toast('請先勾選文章','err'); return; }
  const targets = [...selectedItems].sort((a,b)=>a-b);
  startBatch();
  for (let i=0; i<targets.length; i++) {
    if (abortFlag) break;
    const idx = targets[i];
    if (!analysisCache[idx]) await runBatchItem(idx, targets.length, i);
  }
  endBatch();
}

async function runBatchItem(idx, total, pos=null) {
  const n = pos !== null ? pos+1 : idx+1;
  setStatus(`分析 ${n}/${total}：第 ${idx+1} 篇…`, true);
  const wrap = el(`awrap-${idx}`);
  const inner = el(`ainner-${idx}`);
  const btn = el(`abtn-${idx}`);
  wrap.classList.add('open');
  btn.textContent='分析中…'; btn.disabled=true;
  inner.innerHTML=`<div class="analysis-progress">⏳ 批次分析中（${n}/${total}）…</div>
    <div class="spinner-box"><div class="spinner"></div>
    <div><div class="spinner-txt">Gemini AI 評讀中</div><div class="spinner-sub">通常需要 10–20 秒</div></div></div>`;
  try {
    const text = await callGemini(articles[idx]);
    analysisCache[idx] = text;
    inner.innerHTML = `<div class="analysis-progress">✓ 分析完成，可手動加入購物車</div>` + renderMd(text);
    // 更新購物車中同一篇的 analysis（若已在購物車）
    const existing = cart.find(c => c.pmid === articles[idx].pmid);
    if (existing) { existing.analysis = text; cartSave(); }
  } catch(e) {
    inner.innerHTML=`<p style="padding:1rem;color:var(--danger)">分析失敗：${e.message}</p>`;
  }
  btn.textContent='收起'; btn.disabled=false;
  // scroll into view gently
  el(`card-${idx}`).scrollIntoView({behavior:'smooth',block:'nearest'});
  await new Promise(r=>setTimeout(r,800)); // rate limiting
}

function startBatch() {
  abortFlag=false; isRunningBatch=true;
  el('abort-btn').style.display='';
  el('analyze-all-btn').style.display='none';
  el('analyze-selected-btn').disabled=true;
}
function endBatch() {
  isRunningBatch=false;
  el('abort-btn').style.display='none';
  el('analyze-all-btn').style.display='';
  el('analyze-selected-btn').disabled=false;
  setStatus('Ready',false);
  if (!abortFlag) toast('分析完成','ok');
  else toast('已停止');
}
function abortAll() {
  abortFlag=true;
}

/* ── SELECT MODE ── */
function toggleSelectMode() {
  selectMode = !selectMode;
  el('select-bar').classList.toggle('show', selectMode);
  el('select-mode-btn').textContent = selectMode ? '✕ 退出勾選' : '☐ 勾選模式';
  document.querySelectorAll('[id^="check-wrap-"]').forEach(w => w.style.display = selectMode ? 'block' : 'none');
  if (!selectMode) { deselectAll(); }
}
function exitSelectMode() { selectMode=false; toggleSelectMode(); }

function onCheckChange(idx) {
  if (el(`chk-${idx}`).checked) {
    selectedItems.add(idx);
    el(`card-${idx}`).classList.add('selected');
  } else {
    selectedItems.delete(idx);
    el(`card-${idx}`).classList.remove('selected');
  }
  const n = selectedItems.size;
  el('sel-num').textContent = n;
  el('analyze-selected-btn').disabled = n === 0;
  el('cart-selected-btn').disabled = n === 0;
}
function selectAll() {
  articles.forEach((_,i)=>{ el(`chk-${i}`).checked=true; selectedItems.add(i); el(`card-${i}`).classList.add('selected'); });
  const n = selectedItems.size;
  el('sel-num').textContent=n;
  el('analyze-selected-btn').disabled=false;
  el('cart-selected-btn').disabled=false;
}
function deselectAll() {
  articles.forEach((_,i)=>{ el(`chk-${i}`).checked=false; el(`card-${i}`).classList.remove('selected'); });
  selectedItems.clear();
  el('sel-num').textContent=0;
  el('analyze-selected-btn').disabled=true;
  el('cart-selected-btn').disabled=true;
}

function addSelectedToCart() {
  if (!selectedItems.size) return;
  let added = 0;
  [...selectedItems].forEach(idx => {
    const a = cartArticleFromIdx(idx);
    if (!cart.find(c => c.pmid === a.pmid)) { cart.push(a); added++; }
  });
  cartSave(); updateCartUI();
  toast(added > 0 ? `已加入 ${added} 篇到購物車（共 ${cart.length} 篇）` : '已選文章都在購物車中', 'ok');
}
function hideSelectUI() {
  selectMode=false;
  el('select-bar').classList.remove('show');
  el('select-mode-btn').style.display='none';
  el('analyze-all-btn').style.display='none';
  el('add-all-btn').style.display='none';
}

/* ── CART (persistent, stores full article objects) ── */
// cart is an array of {pmid, title, titleZh, journal, date, link, doi, analysis}
// stored in localStorage so it survives topic changes

function cartLoad() {
  try { return JSON.parse(localStorage.getItem('gynonc_cart') || '[]'); }
  catch { return []; }
}
function cartSave() {
  localStorage.setItem('gynonc_cart', JSON.stringify(cart));
}

function cartArticleFromIdx(idx) {
  const a = articles[idx];
  return {
    pmid: a.pmid, title: a.title, titleZh: a.titleZh || '',
    journal: a.journal, date: a.date, link: a.link, doi: a.doi,
    analysis: analysisCache[idx] || ''
  };
}

function addToCartSilent(idx) {
  const a = cartArticleFromIdx(idx);
  if (!cart.find(c => c.pmid === a.pmid)) {
    cart.push(a); cartSave(); updateCartUI();
  }
}
function addToCart(idx) {
  const a = cartArticleFromIdx(idx);
  if (!cart.find(c => c.pmid === a.pmid)) {
    cart.push(a); cartSave(); updateCartUI();
    toast(`已加入購物車（共 ${cart.length} 篇）`, 'ok');
  } else {
    toast('此文章已在購物車中');
  }
}
function addAllToCart() {
  let added = 0;
  articles.forEach((_, i) => {
    const a = cartArticleFromIdx(i);
    if (!cart.find(c => c.pmid === a.pmid)) { cart.push(a); added++; }
  });
  cartSave(); updateCartUI();
  toast(added > 0 ? `已加入 ${added} 篇（共 ${cart.length} 篇）` : '全部文章已在購物車中', 'ok');
}
function removeFromCart(pmid) {
  cart = cart.filter(c => c.pmid !== pmid);
  cartSave(); updateCartUI(); renderDrawer();
}
function clearCart() {
  cart = []; cartSave(); updateCartUI(); renderDrawer();
  toast('購物車已清空');
}

/* ── SIDEBAR (mobile toggle) ── */
function toggleSidebar() {
  const s = el('sidebar'), o = el('sidebar-overlay');
  const open = s.classList.toggle('open');
  o.classList.toggle('open', open);
  document.body.style.overflow = open ? 'hidden' : '';
}
function closeSidebar() {
  el('sidebar').classList.remove('open');
  el('sidebar-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
function scrollToTop() {
  document.querySelector('main').scrollTo({top:0, behavior:'smooth'});
  window.scrollTo({top:0, behavior:'smooth'});
}

function updateCartUI() {
  const n = cart.length;
  const badge = el('cart-badge');
  badge.textContent = n; badge.style.display = n > 0 ? 'inline-flex' : 'none';
  el('drawer-count').textContent = `${n} 篇`;
  // bottom nav badge
  const nb = el('nav-badge');
  if (nb) { nb.textContent = n; nb.classList.toggle('show', n > 0); }
}

/* ── CART DRAWER ── */
function openCart() {
  renderDrawer();
  el('cart-overlay').classList.add('open');
  el('cart-drawer').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeCart() {
  el('cart-overlay').classList.remove('open');
  el('cart-drawer').classList.remove('open');
  document.body.style.overflow = '';
}

function renderDrawer() {
  const body = el('drawer-body');
  if (!cart.length) {
    body.innerHTML = `<div class="cart-empty">
      <div class="cart-empty-icon">∅</div>
      <p style="font-size:.85rem">購物車是空的<br>搜尋文章後點「+ 加入」或「全加入購物車」</p>
    </div>`;
    return;
  }
  body.innerHTML = cart.map((c, i) => `
    <div class="cart-item">
      <div class="cart-item-num">${String(i+1).padStart(2,'0')}</div>
      <div class="cart-item-body">
        <div class="cart-item-en"><a href="${c.link}" target="_blank">${c.title}</a></div>
        ${c.titleZh ? `<div class="cart-item-zh">${c.titleZh}</div>` : ''}
        <div class="cart-item-meta">
          ${c.journal}
          ${c.date ? `<span class="cart-item-tag">${c.date}</span>` : ''}
          ${c.analysis ? `<span class="cart-item-tag" style="background:var(--teal-pale);color:var(--teal);border-color:rgba(42,124,116,.2)">✓ 已評讀</span>` : ''}
        </div>
      </div>
      <button class="cart-remove" onclick="removeFromCart('${c.pmid}')" title="從購物車移除">✕</button>
    </div>`).join('');
}

/* ── GITHUB ACTIONS ── */
async function triggerGitHubReport() {
  const owner=v('gh-owner'), repo=v('gh-repo'), branch=v('gh-branch')||'main';
  const workflow=v('gh-workflow')||'weekly_report.yml', token=v('gh-token');
  if (!owner||!repo||!token) { toast('請填寫 GitHub 帳號、Repo 和 Token','err'); return; }
  if (!cart.length) { toast('購物車是空的，請先加入文章','err'); return; }

  // 把購物車 PMID 清單傳給 Actions（最多傳50篇避免超出input長度）
  const pmids = cart.slice(0,50).map(c=>c.pmid).join(',');

  setStatus('Triggering GitHub Actions…',true);
  const url = `https://api.github.com/repos/${owner}/${repo}/actions/workflows/${workflow}/dispatches`;

  try {
    const resp = await fetch(url, {
      method:'POST',
      headers:{
        'Authorization':`Bearer ${token}`,
        'Accept':'application/vnd.github+json',
        'X-GitHub-Api-Version':'2022-11-28',
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        ref: branch,
        inputs: {
          pmids: pmids,          // 傳入指定 PMID 清單
          days_back: v('days-back')||'7',
          max_results: v('max-results')||'10'
        }
      })
    });

    if (resp.status===204) {
      toast(`已觸發！將寄出購物車 ${cart.length} 篇文章，約 2–3 分鐘後收到 ✓`,'ok');
      setStatus('Actions triggered',false);
    } else {
      const err = await resp.json().catch(()=>({}));
      const msg = err.message || `HTTP ${resp.status}`;
      toast(`觸發失敗：${msg}`,'err');
      if (resp.status===404) toast('404：請確認 Repo 名稱、分支名稱和 Workflow 檔名','err');
      if (resp.status===401||resp.status===403) toast('403：Token 無效或缺少 workflow 權限','err');
      setStatus('Error',false);
    }
  } catch(e) { toast(`網路錯誤：${e.message}`,'err'); setStatus('Error',false); }
}

/* ── UTILS ── */
function setStatus(text,active=false){
  el('status-text').textContent=text;
  el('status-dot').style.background=active?'#e8b84b':'#52c78a';
}
function setProgress(pct,done=false){
  const w=el('progress-wrap'),b=el('progress-bar');
  w.classList.add('on'); b.style.width=pct+'%';
  if(done) setTimeout(()=>{w.classList.remove('on');b.style.width='0%';},600);
}
let tt;
function toast(msg,type=''){
  const e=el('toast'); e.textContent=msg; e.className='show'+(type?' '+type:'');
  clearTimeout(tt); tt=setTimeout(()=>{e.className='';},3800);
}

window.addEventListener('load', () => { loadConfig(); updateCartUI(); });
</script>
